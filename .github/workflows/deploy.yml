name: Deploy to Namecheap

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /
          state-name: sync-4
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            workers/**
            README.md
            CLAUDE.md
            **/*.m4a
            **/*.mp3
            **/*.py
            flask_app/**
            docs/**
            firestore.rules
            filter.txt
            error_log
            **/*.log
            _unlink_test.tmp
